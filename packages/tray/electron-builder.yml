appId: com.nudge.tray
productName: Nudge
copyright: Nudge

# Pinned explicitly: this is an npm-workspaces monorepo, so `electron` is
# hoisted to the ROOT node_modules and electron-builder cannot find it under
# packages/tray to infer a version. Without this it fails outright with
# "Cannot compute electron version from installed node modules". Keep in step
# with the `electron` devDependency in package.json.
electronVersion: 33.4.11

directories:
  output: release
  buildResources: build

# dist/ only — src/ is deliberately NOT shipped. That is exactly why
# ASSETS_DIR resolves to dist/assets and the build has a copy-assets step:
# the icons have to live inside the build output to survive packaging.
# package.json is required for Electron to find "main".
files:
  - dist/**/*
  - package.json

# The bundle is self-contained (esbuild inlines @nudge/client and
# @nudge/shared, with only `electron` left external), so no node_modules
# needs shipping. asar keeps it to a single archive.
asar: true

# The app has NO runtime dependencies — esbuild inlines @nudge/client and
# @nudge/shared into dist/index.cjs, leaving only `electron` external, and
# Electron supplies that itself. Without this, electron-builder runs a
# production-only `npm install` in the package before building, which in this
# workspace prunes devDependencies — including electron-builder's own
# app-builder-bin — and the build then dies with a confusing ENOENT while
# spawning a binary it just deleted from under itself.
npmRebuild: false
buildDependenciesFromSource: true

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
  # LSUIElement: a menu-bar app with no permanent Dock icon. Task 7 makes the
  # Dock icon appear only while something is waiting, and hides it again on
  # resolve — a permanent icon would defeat that, and the bounce needs the
  # icon to be absent first for its appearance to mean anything.
  extendInfo:
    LSUIElement: 1
  # Unsigned: signing needs a paid Apple Developer account. Gatekeeper will
  # quarantine the .dmg, so the README documents the right-click -> Open
  # workaround honestly rather than pretending it installs cleanly.
  identity: null

win:
  target:
    - target: nsis
      arch: [x64, arm64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

linux:
  category: Development
  target:
    - target: AppImage
      arch: [x64, arm64]
