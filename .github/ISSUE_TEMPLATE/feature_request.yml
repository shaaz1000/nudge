name: Feature request
description: Suggest an idea
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The situation where today's behaviour lets you down.
    validations: { required: true }
  - type: textarea
    id: solution
    attributes:
      label: What would you like it to do?
    validations: { required: true }
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you've tried or considered instead?
