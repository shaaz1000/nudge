name: ci
on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npx tsc --build
      - run: npx vitest run
      # Finding I5: tsc + vitest alone never bundle or package the vscode
      # extension — a green build here previously said nothing about
      # whether `vsce package` (which walks node_modules and chokes on this
      # monorepo's workspace symlink unless run with --no-dependencies) or
      # the esbuild bundle it depends on actually still produce a loadable
      # artifact. This exercises the bundle step and then proves the
      # workspace package specifier got fully inlined by esbuild rather than
      # left as an unresolved `require('@nudge/...')` that would only ever
      # fail at runtime, inside a real extension host, on someone's machine.
      - run: npm run bundle -w nudge-vscode
      - run: node packages/vscode/scripts/verify-bundle.mjs
      # Same reasoning for the tray, which additionally ships ICONS and the
      # ENGINE. Nothing in the unit suite touches the filesystem (every test
      # injects a fake loadImage), so a missing icon or a dropped copy-assets
      # step leaves the whole suite green and ships a blank menu-bar icon —
      # which is exactly the defect ASSETS_DIR originally had.
      - run: npm run bundle -w nudge-tray
      - run: node packages/tray/scripts/verify-bundle.mjs
      # The packaged app is built against whatever `electronVersion` the yml
      # pins; if that drifts from the installed devDependency, the artefact is
      # built on an Electron nobody tested.
      - run: npm run check-electron-pin -w nudge-tray
      # Type-check the TEST files too. Nothing else does: every package
      # tsconfig is `include: src/**`, and vitest transpiles without checking,
      # so `@ts-expect-error` guards in tests were inert and an interface
      # change broke fakes at runtime rather than at compile time.
      - run: npx tsc -p tsconfig.test.json
