<svg xmlns="http://www.w3.org/2000/svg" width="920" height="540" viewBox="0 0 920 540" role="img" aria-label="Diagram: where each Nudge signal appears — menu bar badge, notification banner, bouncing Dock icon, and a phone push after three minutes.">
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3140"/><stop offset="1" stop-color="#1b202b"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <style>
      .t  { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .lbl{ font-size: 13px; fill: #9aa4b8; }
      .num{ font-size: 12px; font-weight: 700; fill: #0e1117; }
      .hd { font-size: 14px; font-weight: 600; fill: #e8edf7; }
      .sb { font-size: 12.5px; fill: #aab4c8; }
      .mn { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; fill: #cdd6e8; }
    </style>
  </defs>

  <rect width="920" height="540" rx="10" fill="#12151c"/>

  <!-- ============ the "screen" ============ -->
  <rect x="26" y="26" width="600" height="404" rx="9" fill="url(#screen)" stroke="#39415280" stroke-width="1"/>

  <!-- menu bar -->
  <rect x="26" y="26" width="600" height="26" rx="9" fill="#151a23"/>
  <rect x="26" y="43" width="600" height="9" fill="#151a23"/>
  <circle cx="486" cy="39" r="3" fill="#5c6883"/><circle cx="504" cy="39" r="3" fill="#5c6883"/>
  <!-- bell + badge -->
  <g transform="translate(522,32)">
    <path d="M7 1.6a4.2 4.2 0 0 0-4.2 4.2v3L1.4 10.6h11.2L11.2 8.8v-3A4.2 4.2 0 0 0 7 1.6Z" fill="#f4b740"/>
    <path d="M5.4 11.9a1.7 1.7 0 0 0 3.2 0Z" fill="#f4b740"/>
    <circle cx="12.4" cy="2.4" r="4.6" fill="#e5484d"/>
    <text x="12.4" y="6.1" class="t num" text-anchor="middle" fill="#fff">1</text>
  </g>
  <circle cx="566" cy="39" r="3" fill="#5c6883"/><circle cx="584" cy="39" r="3" fill="#5c6883"/>
  <text x="606" y="43" class="t lbl" text-anchor="end" fill="#6d7891">9:41</text>

  <!-- notification banner -->
  <g filter="url(#soft)">
    <rect x="356" y="68" width="252" height="74" rx="12" fill="#eef1f7"/>
    <rect x="368" y="80" width="30" height="30" rx="7" fill="#f4b740"/>
    <path d="M383 87.4a3.1 3.1 0 0 0-3.1 3.1v2.2l-1 1.3h8.2l-1-1.3v-2.2a3.1 3.1 0 0 0-3.1-3.1Z" fill="#7a5205"/>
    <text x="408" y="90" class="t" font-size="12.5" font-weight="700" fill="#0e1117">Nudge</text>
    <text x="408" y="107" class="t" font-size="12.5" fill="#20242e">acme-api needs you</text>
    <text x="408" y="124" class="t" font-size="12" fill="#5a6274">Allow npm install?</text>
  </g>

  <!-- editor window -->
  <rect x="58" y="92" width="266" height="262" rx="8" fill="#1a1f29" stroke="#39415280"/>
  <rect x="58" y="92" width="266" height="22" rx="8" fill="#232936"/>
  <rect x="58" y="106" width="266" height="8" fill="#232936"/>
  <circle cx="72" cy="103" r="3.4" fill="#e5484d"/><circle cx="84" cy="103" r="3.4" fill="#f4b740"/><circle cx="96" cy="103" r="3.4" fill="#46a758"/>
  <text x="74" y="140" class="t mn" fill="#7f8aa3">$ claude</text>
  <text x="74" y="162" class="t mn">Refactoring auth module…</text>
  <text x="74" y="184" class="t mn" fill="#7f8aa3">  ✓ read 4 files</text>
  <text x="74" y="206" class="t mn" fill="#7f8aa3">  ✓ ran tests</text>
  <rect x="70" y="222" width="242" height="30" rx="5" fill="#2a2213" stroke="#f4b74066"/>
  <text x="80" y="242" class="t mn" fill="#f4b740">? Allow npm install? (y/n)</text>
  <text x="74" y="276" class="t mn" fill="#5b6478">waiting…</text>

  <!-- Dock -->
  <rect x="150" y="372" width="352" height="46" rx="13" fill="#212734" stroke="#39415280"/>
  <rect x="172" y="382" width="28" height="28" rx="7" fill="#495267"/>
  <rect x="210" y="382" width="28" height="28" rx="7" fill="#495267"/>
  <rect x="248" y="382" width="28" height="28" rx="7" fill="#495267"/>
  <!-- the bouncing one -->
  <g transform="translate(286,352)">
    <rect width="30" height="30" rx="7" fill="#f4b740"/>
    <path d="M15 7.2a4.6 4.6 0 0 0-4.6 4.6v3.3l-1.5 2h12.2l-1.5-2v-3.3A4.6 4.6 0 0 0 15 7.2Z" fill="#7a5205"/>
    <path d="M12.6 18.3a2.5 2.5 0 0 0 4.8 0Z" fill="#7a5205"/>
  </g>
  <path d="M301 350 q0 -16 0 -18" stroke="#f4b740" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.85"/>
  <path d="M292 340 q9 -12 18 0" stroke="#f4b740" stroke-width="1.6" fill="none" stroke-linecap="round" opacity="0.5"/>
  <circle cx="301" cy="414" r="8" fill="#f4b74033"/>
  <rect x="330" y="382" width="28" height="28" rx="7" fill="#495267"/>
  <rect x="368" y="382" width="28" height="28" rx="7" fill="#495267"/>

  <!-- ============ phone ============ -->
  <rect x="686" y="150" width="150" height="256" rx="20" fill="#1a1f29" stroke="#39415280"/>
  <rect x="736" y="158" width="50" height="8" rx="4" fill="#2b3140"/>
  <g filter="url(#soft)">
    <rect x="698" y="186" width="126" height="62" rx="11" fill="#eef1f7"/>
    <rect x="708" y="196" width="20" height="20" rx="5" fill="#f4b740"/>
    <text x="736" y="204" class="t" font-size="10.5" font-weight="700" fill="#0e1117">Nudge</text>
    <text x="736" y="219" class="t" font-size="10.5" fill="#20242e">acme-api</text>
    <text x="708" y="238" class="t" font-size="10" fill="#5a6274">blocked · 3m</text>
  </g>
  <text x="761" y="392" class="t lbl" text-anchor="middle" font-size="11">your phone</text>

  <!-- ============ callouts ============ -->
  <g class="t">
    <circle cx="646" cy="39" r="9" fill="#f4b740"/><text x="646" y="43.5" class="num" text-anchor="middle">1</text>
    <text x="662" y="36" class="hd">Menu bar</text>
    <text x="662" y="52" class="sb">always visible, badged with the count</text>

    <circle cx="646" cy="86" r="9" fill="#f4b740"/><text x="646" y="90.5" class="num" text-anchor="middle">2</text>
    <text x="662" y="83" class="hd">Notification + sound</text>
    <text x="662" y="99" class="sb">click it to jump to the right window</text>

    <circle cx="43" cy="452" r="9" fill="#f4b740"/><text x="43" y="456.5" class="num" text-anchor="middle">3</text>
    <text x="60" y="449" class="hd">Dock icon appears and bounces</text>
    <text x="60" y="467" class="sb">and keeps bouncing until you answer — a banner disappears, this does not</text>

    <circle cx="646" cy="140" r="9" fill="#f4b740"/><text x="646" y="144.5" class="num" text-anchor="middle">4</text>
    <text x="662" y="137" class="hd">Phone, after 3 minutes</text>
    <text x="662" y="153" class="sb">only if you still haven't come back</text>
  </g>

  <text x="34" y="506" class="t sb" fill="#6d7891">Diagram, not a screenshot — it shows where each signal appears. Timings and text are the real defaults.</text>
</svg>
